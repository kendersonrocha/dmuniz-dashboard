name: Refresh ClickUp Data

# Roda automaticamente a cada hora (top of hour) + sob demanda
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh data.json from ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/refresh-data.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data.json)" ]]; then
            git add public/data.json
            git commit -m "🔄 auto-refresh ClickUp data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Sem mudanças nos dados — skip commit."
          fi
